[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["spark: needs pyspark and Java"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness checks (syntax errors, undefined names, unused imports); style is not enforced in CI.
select = ["E4", "E7", "E9", "F"]
